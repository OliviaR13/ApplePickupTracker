name: ApplePickupTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  ApplePickupTracker:
    type: application
    platform: iOS
    dependencies:
      - target: PickupWidget
        embed: true
    sources:
      - path: App
      - path: Outlook
      - path: Models
      - path: Storage
      - path: Tracking
      - path: LiveActivity
      - path: Notifications
      - path: Views
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Apple Pickup Tracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - msauth.com.example.ApplePickupTracker
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.ApplePickupTracker.refresh
        NSSupportsLiveActivities: true
        NSUserNotificationUsageDescription: 当 Apple Store 订单可以取货时通知你。
        NSFaceIDUsageDescription: 使用 Face ID 验证身份后展示 Apple Store 取货二维码。
        UILaunchStoryboardName: LaunchScreen
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ApplePickupTracker
        PRODUCT_NAME: ApplePickupTracker
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Apple Pickup Tracker
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
  PickupWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: LiveActivity/PickupAttributes.swift
      - path: Models/PickupOrder.swift
    info:
      path: Resources/Widget-Info.plist
      properties:
        CFBundleDisplayName: Pickup Live Activity
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ApplePickupTracker.PickupWidget
        PRODUCT_NAME: PickupWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
