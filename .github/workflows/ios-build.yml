name: iOS Build

on:
  push:
    branches:
      - main
      - master
      - 'cursor/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcode-select -p
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK ${sdk}"
          case "${sdk}" in
            26.*) ;;
            *)
              echo "iOS 26 SDK is required to compile Liquid Glass APIs (got ${sdk})." >&2
              exit 1
              ;;
          esac

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and package unsigned IPA
        run: bash ./package-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ApplePickupTracker-unsigned-ipa
          path: build/ApplePickupTracker-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
